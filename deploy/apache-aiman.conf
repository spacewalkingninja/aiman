# Sample Apache reverse-proxy config for aiman.
#
# The terminal uses a WebSocket bridge at /ptyws/. A plain `ProxyPass /` uses
# mod_proxy_http, which does NOT tunnel WebSocket upgrades — without the
# explicit ws:// rules below the terminal shows "session ended". Make sure
# mod_proxy_wstunnel is enabled:
#
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo systemctl reload apache2
#
# This file assumes aiman listens on 127.0.0.1:4097.

ProxyPreserveHost On
ProxyTimeout 3600
Timeout 3600

# WebSocket bridge for the embedded opencode terminal.
ProxyPass        /ptyws ws://127.0.0.1:4097/ptyws
ProxyPassReverse /ptyws ws://127.0.0.1:4097/ptyws

# opencode HTTP proxy (SSE + PTY create/list/delete).
ProxyPass        /oc/ http://127.0.0.1:4097/oc/ flushpackets=on
ProxyPassReverse /oc/ http://127.0.0.1:4097/oc/

# Everything else: the aiman SPA + REST API.
ProxyPass        / http://127.0.0.1:4097/ flushpackets=on
ProxyPassReverse / http://127.0.0.1:4097/

SetEnv no-gzip 1
<LocationMatch "^/(index\.html)?$">
    Header always set Cache-Control "no-store, no-cache, must-revalidate"
    Header always set Pragma "no-cache"
</LocationMatch>
<LocationMatch "^/oc/(global/)?event">
    Header set Cache-Control "no-cache, no-transform"
    Header set X-Accel-Buffering "no"
</LocationMatch>
